name: specai
description: "SpecAI — маркетплейс аренды спецтехники"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo/png/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/png/icon-1024.png"
  min_sdk_android: 21
  web:
    generate: false # web/manifest.json icons already point at our own PNGs
