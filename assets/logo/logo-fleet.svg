<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560">
  <defs>
    <style>
      .body{fill:#F5C518}
      .dark{fill:#F2A900}
      .black{fill:#1A1A1A}
      .white{fill:#FFFFFF}
      .shadow{fill:#000000;opacity:0.12}
    </style>
  </defs>

  <rect width="700" height="560" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- ===== Row 1 ===== -->
  <!-- Cell 1: Dump truck -->
  <g transform="translate(20,20)">
    <rect width="200" height="160" rx="14" fill="#FAFAFA"/>
    <ellipse cx="100" cy="128" rx="70" ry="8" class="shadow"/>
    <rect x="40" y="70" width="34" height="34" rx="4" class="body"/>
    <rect x="46" y="76" width="18" height="14" rx="2" class="white"/>
    <polygon points="74,60 130,60 140,100 74,100" class="dark"/>
    <rect x="74" y="55" width="56" height="8" class="dark"/>
    <circle cx="60" cy="106" r="14" class="black"/>
    <circle cx="60" cy="106" r="5" class="body"/>
    <circle cx="115" cy="106" r="14" class="black"/>
    <circle cx="115" cy="106" r="5" class="body"/>
  </g>

  <!-- Cell 2: Bulldozer -->
  <g transform="translate(250,20)">
    <rect width="200" height="160" rx="14" fill="#FAFAFA"/>
    <ellipse cx="100" cy="128" rx="70" ry="8" class="shadow"/>
    <rect x="60" y="60" width="70" height="34" rx="4" class="body"/>
    <rect x="66" y="66" width="26" height="16" rx="2" class="white"/>
    <rect x="30" y="94" width="100" height="16" rx="4" class="black"/>
    <polygon points="20,70 40,70 40,110 12,110" class="dark"/>
    <rect x="40" y="112" width="100" height="20" rx="10" class="black"/>
    <circle cx="55" cy="122" r="7" fill="#4B5563"/>
    <circle cx="75" cy="122" r="7" fill="#4B5563"/>
    <circle cx="95" cy="122" r="7" fill="#4B5563"/>
    <circle cx="115" cy="122" r="7" fill="#4B5563"/>
  </g>

  <!-- Cell 3: Mobile crane -->
  <g transform="translate(480,20)">
    <rect width="200" height="160" rx="14" fill="#FAFAFA"/>
    <ellipse cx="100" cy="128" rx="70" ry="8" class="shadow"/>
    <rect x="40" y="90" width="90" height="24" rx="4" class="body"/>
    <rect x="46" y="70" width="26" height="24" rx="3" class="dark"/>
    <rect x="52" y="75" width="14" height="12" class="white"/>
    <line x1="72" y1="72" x2="150" y2="30" stroke="#F2A900" stroke-width="8" stroke-linecap="round"/>
    <line x1="150" y1="30" x2="158" y2="55" stroke="#374151" stroke-width="3"/>
    <circle cx="60" cy="118" r="13" class="black"/>
    <circle cx="60" cy="118" r="4" class="body"/>
    <circle cx="85" cy="118" r="13" class="black"/>
    <circle cx="85" cy="118" r="4" class="body"/>
    <circle cx="112" cy="118" r="13" class="black"/>
    <circle cx="112" cy="118" r="4" class="body"/>
  </g>

  <!-- ===== Row 2 ===== -->
  <!-- Cell 4: Wheel loader -->
  <g transform="translate(20,200)">
    <rect width="200" height="160" rx="14" fill="#FAFAFA"/>
    <ellipse cx="100" cy="128" rx="70" ry="8" class="shadow"/>
    <rect x="70" y="72" width="42" height="30" rx="4" class="body"/>
    <rect x="76" y="78" width="18" height="14" rx="2" class="white"/>
    <rect x="30" y="98" width="90" height="18" rx="4" class="dark"/>
    <line x1="30" y1="105" x2="8" y2="90" stroke="#F2A900" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 78 L20 78 L26 98 L4 98 Z" class="dark"/>
    <circle cx="52" cy="120" r="16" class="black"/>
    <circle cx="52" cy="120" r="6" class="body"/>
    <circle cx="102" cy="120" r="16" class="black"/>
    <circle cx="102" cy="120" r="6" class="body"/>
  </g>

  <!-- Cell 5: Excavator -->
  <g transform="translate(250,200)">
    <rect width="200" height="160" rx="14" fill="#FAFAFA"/>
    <ellipse cx="100" cy="128" rx="70" ry="8" class="shadow"/>
    <rect x="40" y="94" width="70" height="26" rx="5" class="body"/>
    <rect x="30" y="118" width="98" height="14" rx="7" class="black"/>
    <circle cx="44" cy="125" r="6" fill="#4B5563"/>
    <circle cx="64" cy="125" r="6" fill="#4B5563"/>
    <circle cx="84" cy="125" r="6" fill="#4B5563"/>
    <circle cx="104" cy="125" r="6" fill="#4B5563"/>
    <rect x="52" y="74" width="30" height="24" rx="5" class="dark"/>
    <rect x="57" y="79" width="16" height="12" rx="2" class="white"/>
    <polygon points="78,86 130,50 140,58 90,96" class="body"/>
    <polygon points="130,50 152,76 144,82 122,60" class="dark"/>
    <path d="M152 76 L168 82 L162 100 L146 94 Z" class="black"/>
  </g>

  <!-- Cell 6: Cement mixer -->
  <g transform="translate(480,200)">
    <rect width="200" height="160" rx="14" fill="#FAFAFA"/>
    <ellipse cx="100" cy="128" rx="70" ry="8" class="shadow"/>
    <rect x="30" y="78" width="30" height="30" rx="4" class="dark"/>
    <rect x="35" y="83" width="16" height="14" rx="2" class="white"/>
    <ellipse cx="95" cy="90" rx="45" ry="24" class="body"/>
    <path d="M55 90 L135 90 L128 70 L62 70 Z" fill="#E8B400"/>
    <rect x="20" y="106" width="120" height="14" rx="4" class="black"/>
    <circle cx="45" cy="118" r="14" class="black"/>
    <circle cx="45" cy="118" r="5" class="body"/>
    <circle cx="110" cy="118" r="14" class="black"/>
    <circle cx="110" cy="118" r="5" class="body"/>
  </g>

  <!-- Caption / signature -->
  <rect x="20" y="392" width="660" height="148" rx="14" fill="#111827"/>
  <text x="350" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="56" fill="#FFFFFF">Spec<tspan fill="#F5C518">AI</tspan></text>
  <text x="350" y="498" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500" font-size="18" letter-spacing="2" fill="#9CA3AF">HEAVY EQUIPMENT RENTAL PLATFORM</text>
</svg>
