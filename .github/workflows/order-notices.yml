name: Order notices

# Every 5 minutes: sends the new-order alerts that waited 5 minutes for the
# providers without the «Пригласи друга» bonus
# (apps/web/src/app/api/cron/notices, lib/deferredOrderNotices.ts). The
# endpoint is idempotent and answers counts only. GitHub may start a scheduled
# run several minutes late; the app's «на линии» reports and the provider feed
# send due alerts too, so this is the backstop, not the only trigger.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send due alerts
        run: curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 https://spec-ai-web.vercel.app/api/cron/notices
