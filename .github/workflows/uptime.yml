name: Проверка сайта

# Every hour: opens the key pages and API of the live site. Pages that use the
# database are included on purpose — a broken database connection (the Prisma
# engine missing on Vercel, 2026-09-29) once went unnoticed because only the
# static home page was checked. A failed run is e-mailed by GitHub.
# Run it by hand from the Actions tab after a deploy, too.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # иистройка24.рф (punycode) since 2026-10-24; the old address sends pages here.
      SITE: https://xn--24-6kc5aagh4arjl.xn--p1ai
    steps:
      # Office tick (apps/web/src/app/api/cron/office): GitHub starts scheduled
      # runs rarely, so every scheduled workflow pokes the office; the endpoint
      # is idempotent and needs CRON_SECRET (repository secret, as in Vercel).
      - name: Office tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET repository secret is not set — office tick skipped"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://spec-ai-web.vercel.app/api/cron/office || true
      - name: Pages and API answer 200
        run: |
          failed=0
          for path in / /equipment /orders /contacts /arenda/avtokran /api/equipment /api/categories; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 5 --max-time 30 "$SITE$path")
            echo "$code $path"
            if [ "$code" != "200" ]; then
              echo "::error::$SITE$path answered $code"
              failed=1
            fi
          done
          # The old address: the app's API lives there, its pages send visitors to the domain.
          old=https://spec-ai-web.vercel.app
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 5 --max-time 30 "$old/api/categories")
          echo "$code $old/api/categories"
          if [ "$code" != "200" ]; then echo "::error::$old/api/categories answered $code"; failed=1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$old/orders")
          echo "$code $old/orders"
          if [ "$code" != "308" ]; then echo "::error::$old/orders answered $code, expected 308 to the domain"; failed=1; fi
          exit $failed
