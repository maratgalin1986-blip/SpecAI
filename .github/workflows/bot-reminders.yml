name: Bot reminders

# Hourly: keeps the Telegram bot connected to the production site and sends
# the bot's single reminder for an abandoned order
# (apps/web/src/app/api/integrations/telegram/connect, .../cron/bot-reminders).
# Both endpoints are idempotent; the reminder requires CRON_SECRET (repository
# secret, equal to the one in Vercel).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep the bot connected
        run: curl -sS https://spec-ai-web.vercel.app/api/integrations/telegram/connect || true
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::CRON_SECRET repository secret is not set"; exit 1; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://spec-ai-web.vercel.app/api/cron/bot-reminders
      - name: Office step
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://spec-ai-web.vercel.app/api/cron/office || true
