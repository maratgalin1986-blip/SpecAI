name: Bot reminders

# Hourly: the Telegram bot's single reminder for an abandoned order
# (apps/web/src/app/api/cron/bot-reminders). Needs the repository secret
# CRON_SECRET equal to CRON_SECRET in Vercel; without it the job does nothing.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set, skipping"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://spec-ai-web.vercel.app/api/cron/bot-reminders
