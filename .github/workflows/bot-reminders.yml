name: Bot reminders

# Hourly: keeps the Telegram bot connected to the production site and sends
# the bot's single reminder for an abandoned order
# (apps/web/src/app/api/integrations/telegram/connect, .../cron/bot-reminders).
# Both endpoints are idempotent; CRON_SECRET (repository secret, equal to the
# one in Vercel) is sent when set.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep the bot connected
        run: curl -sS https://spec-ai-web.vercel.app/api/integrations/telegram/connect || true
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then AUTH="Authorization: Bearer $CRON_SECRET"; else AUTH="X-No-Secret: 1"; fi
          curl -fsS -H "$AUTH" https://spec-ai-web.vercel.app/api/cron/bot-reminders
