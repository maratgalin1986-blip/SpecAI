name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: specai
          POSTGRES_PASSWORD: specai
          POSTGRES_DB: specai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U specai -d specai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: 'postgresql://specai:specai@localhost:5432/specai?schema=public'
      DIRECT_URL: 'postgresql://specai:specai@localhost:5432/specai?schema=public'
      NEXTAUTH_SECRET: 'ci-build-secret'
      NEXTAUTH_URL: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The production build runs `prisma db push` without --accept-data-loss and stops on a
      # risky change (a new @unique, a dropped column): PR #110 never reached production on
      # 2026-11-09 because of a new @unique. The same check here: main's schema first, then
      # this branch's schema on top.
      - name: Schema push from the base branch needs no data-loss flag
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git show "origin/${{ github.base_ref }}:packages/database/prisma/schema.prisma" > "$RUNNER_TEMP/base.prisma"
          cd packages/database
          npx prisma db push --skip-generate --schema "$RUNNER_TEMP/base.prisma"
          npx prisma db push --skip-generate --schema prisma/schema.prisma

      - name: Build
        run: pnpm build
