name: Overpass probe

# One-off check (2026-11-10): does the Overpass API answer from a GitHub runner? It resets
# connections from Vercel and from cloud sessions, so before the office search is moved here
# the assumption is tested once. Runs only when this file changes on the office branch.
on:
  push:
    branches: ['claude/pensive-feynman-bila02']
    paths: ['.github/workflows/overpass-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ask each Overpass mirror
        run: |
          UA='SpecPlast16-office/1.0 (+https://xn--24-6kc5aagh4arjl.xn--p1ai; specplast16@mail.ru)'
          Q1='[out:json][timeout:25];(nwr["shop"="beauty"](around:15000,55.796,49.108);nwr["shop"="hairdresser"](around:15000,55.796,49.108););out center tags;'
          Q2='[out:json][timeout:25];(nwr["office"="company"]["name"~"техник|кран|экскаватор|аренд",i](around:15000,55.7436,52.3958);nwr["shop"="rental"](around:15000,55.7436,52.3958););out center tags;'
          for h in https://overpass-api.de/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            for q in "$Q1" "$Q2"; do
              rm -f out.json
              code=$(curl -sS -o out.json -w '%{http_code} %{time_total}s %{size_download}b' --max-time 45 -A "$UA" --data-urlencode "data=$q" "$h" 2>&1 || true)
              n=$(python3 -c "import json;d=json.load(open('out.json'));e=d.get('elements',[]);print(len(e), 'with_phone', sum(1 for x in e if any(k in x.get('tags',{}) for k in ('phone','contact:phone'))), 'no_site', sum(1 for x in e if not any(k in x.get('tags',{}) for k in ('website','contact:website'))))" 2>/dev/null || echo "not-json: $(head -c 120 out.json 2>/dev/null | tr '\n' ' ')")
              echo "RESULT $h -> $code elements=$n"
              sleep 2
            done
          done
